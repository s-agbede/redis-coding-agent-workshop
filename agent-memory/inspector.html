<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Memory</title>
<style>
  :root { --bg:#0b1b24; --panel:#13293a; --line:#24404f; --text:#e6edf0; --muted:#9fb1ba; --accent:#ff6b5e; --blue:#7fa8ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; }
  .owner { color:var(--muted); font-size:12px; }
  nav { display:flex; gap:4px; margin-left:auto; }
  nav button, .refresh { background:none; border:1px solid var(--line); color:var(--muted); padding:5px 12px; border-radius:6px; cursor:pointer; font:inherit; }
  nav button[aria-selected="true"] { color:var(--text); border-color:var(--accent); }
  .refresh:hover, nav button:hover { color:var(--text); }
  main { padding:16px; }
  .note { color:var(--muted); }
  .error { color:var(--accent); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px; }
  .meta { color:var(--muted); font-size:12px; margin-top:4px; }
  .tag { display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; border:1px solid var(--blue); color:var(--blue); margin-right:6px; }
  .session { cursor:pointer; font-family:ui-monospace, Menlo, monospace; font-size:12px; }
  .session:hover { border-color:var(--accent); }
  .role { font-weight:600; font-size:12px; color:var(--blue); }
  .role.user { color:var(--accent); }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; font:12px/1.5 ui-monospace, Menlo, monospace; }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .editor { margin-top:8px; }
  .editor textarea { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; font:12px/1.5 ui-monospace, Menlo, monospace; }
  .buttons { display:flex; gap:6px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>Agent Memory</h1>
  <span class="owner" id="owner"></span>
  <nav role="tablist">
    <button role="tab" data-view="memories" aria-selected="true">Long-term memories</button>
    <button role="tab" data-view="sessions" aria-selected="false">Sessions</button>
    <button role="tab" data-view="settings" aria-selected="false">Store settings</button>
  </nav>
  <button class="refresh" id="refresh">Refresh</button>
</header>
<main id="view"></main>
<script>
const view = document.getElementById('view');
let current = 'memories';

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

async function get(path) {
  const response = await fetch('api/' + path, { cache: 'no-store' });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || response.statusText);
  return result;
}
const save = (name, value) => post('settings/' + name, { value });

function when(iso) { return iso ? new Date(iso).toLocaleString() : ''; }

async function showMemories() {
  const { owner, memories } = await get('memories');
  document.getElementById('owner').textContent = 'Owner: ' + owner;
  if (!memories.length) return view.append(el('p', 'note', 'Nothing extracted yet. Extraction runs in the background, a minute or so after a conversation.'));
  for (const memory of memories) {
    const card = el('div', 'card');
    const head = el('div', 'head');
    const text = el('div');
    if (memory.type) text.append(el('span', 'tag', memory.type));
    text.append(el('span', '', memory.text));
    const forget = el('button', 'refresh', 'Forget');
    forget.onclick = async () => {
      if (!confirm('Forget this memory? It is deleted from Redis Agent Memory.\n\n' + memory.text)) return;
      try { await post('memories/' + encodeURIComponent(memory.id) + '/forget', {}); render('memories'); }
      catch (error) { card.append(el('p', 'error', error.message)); }
    };
    head.append(text, forget);
    card.append(head, el('div', 'meta', when(memory.createdAt)));
    view.append(card);
  }
}

async function showSessions() {
  const { owner, sessions } = await get('sessions');
  document.getElementById('owner').textContent = 'Owner: ' + owner;
  if (!sessions.length) return view.append(el('p', 'note', 'No stored sessions yet. Sessions are stored once capture is switched on.'));
  for (const id of sessions) {
    const card = el('div', 'card session', id);
    card.onclick = () => showSession(id);
    view.append(card);
  }
}

async function showSession(id) {
  view.replaceChildren(el('p', 'note', 'Loading…'));
  try {
    const { events } = await get('sessions/' + encodeURIComponent(id));
    const back = el('button', 'refresh', '← All sessions');
    back.onclick = () => render('sessions');
    view.replaceChildren(back, el('p', 'meta', 'Session ' + id));
    for (const event of events) {
      const card = el('div', 'card');
      card.append(el('div', 'role ' + event.role.toLowerCase(), event.role + (event.actor ? ' · ' + event.actor : '')),
                  el('pre', '', event.text), el('div', 'meta', when(event.createdAt)));
      view.append(card);
    }
  } catch (error) {
    view.replaceChildren(el('p', 'error', error.message));
  }
}

const EDITABLE = ['shortMemory', 'longTermMemory', 'extractionCadence', 'summarization', 'longTermMemoryExclusions'];
const NEW_TYPE = { name: 'new_type', description: 'What this memory type holds.', fields: [],
                   extractionStrategy: { enabled: true, prompt: 'Extract … only when the user says …' } };

async function post(path, body) {
  const response = await fetch('api/' + path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || response.statusText);
  return result;
}

function editor(name, value, onSaved) {
  const box = el('div', 'editor');
  const text = el('textarea');
  text.value = JSON.stringify(value ?? null, null, 2);
  text.rows = Math.min(24, text.value.split('\n').length + 2);
  const status = el('p', 'meta');
  const saveButton = el('button', 'refresh', 'Save');
  const cancel = el('button', 'refresh', 'Cancel');
  cancel.onclick = () => render('settings');
  saveButton.onclick = async () => {
    let parsed;
    try { parsed = JSON.parse(text.value); } catch { return status.replaceChildren(el('span', 'error', 'That is not valid JSON.')); }
    status.textContent = 'Saving…';
    try { onSaved(await save(name, parsed)); } catch (error) { status.replaceChildren(el('span', 'error', error.message)); }
  };
  const buttons = el('div', 'buttons');
  buttons.append(saveButton, cancel);
  box.append(text, buttons, status);
  return box;
}

function promptEditor(types, index, onSaved) {
  const box = el('div', 'editor');
  box.append(el('div', 'meta', 'Extraction prompt for ' + types[index].name));
  const text = el('textarea');
  text.value = types[index].extractionStrategy?.prompt || '';
  text.rows = 6;
  const status = el('p', 'meta');
  const saveButton = el('button', 'refresh', 'Save prompt');
  saveButton.onclick = async () => {
    status.textContent = 'Saving…';
    try { onSaved(await post('custom-types/' + encodeURIComponent(types[index].name) + '/prompt', { prompt: text.value })); }
    catch (error) { status.replaceChildren(el('span', 'error', error.message)); }
  };
  box.append(text, saveButton, status);
  return box;
}

function addTypeForm(onSaved) {
  const box = el('div', 'editor');
  const open = el('button', 'refresh', 'Add a custom type');
  open.onclick = () => {
    const text = el('textarea');
    text.value = JSON.stringify(NEW_TYPE, null, 2);
    text.rows = 12;
    const status = el('p', 'meta', 'A store holds at most 3 custom types. Field types: str, int, float, bool, list[str].');
    const create = el('button', 'refresh', 'Create type');
    create.onclick = async () => {
      let parsed;
      try { parsed = JSON.parse(text.value); } catch { return status.replaceChildren(el('span', 'error', 'That is not valid JSON.')); }
      status.textContent = 'Creating…';
      try { onSaved(await post('custom-types', { value: parsed })); } catch (error) { status.replaceChildren(el('span', 'error', error.message)); }
    };
    box.replaceChildren(text, create, status);
  };
  box.append(open);
  return box;
}

function drawSettings(result, notice) {
  view.replaceChildren(el('p', 'meta', 'Store ' + result.storeId + ', read live from the Control Plane'
    + (result.editable ? '. Changes apply to everyone using this store.' : '. Read only.')));
  if (notice) view.append(el('p', 'note', notice));
  const redraw = saved => drawSettings(saved, 'Saved. Showing the settings the Control Plane now holds.');
  for (const [name, value] of Object.entries(result.settings)) {
    const card = el('div', 'card');
    const head = el('div', 'head');
    head.append(el('div', 'role', name));
    const body = el('pre', '', typeof value === 'string' ? value : JSON.stringify(value, null, 2));
    if (result.editable && EDITABLE.includes(name)) {
      const edit = el('button', 'refresh', 'Edit');
      edit.onclick = () => body.replaceWith(editor(name, value, redraw));
      head.append(edit);
    }
    card.append(head, body);
    if (result.editable && name === 'customMemoryTypes') {
      const types = Array.isArray(value) ? value : [];
      types.forEach((_, index) => card.append(promptEditor(types, index, redraw)));
      card.append(addTypeForm(redraw));
    }
    view.append(card);
  }
}

async function showSettings() {
  const result = await get('settings');
  if (!result.available) return view.append(el('p', 'note', result.message));
  drawSettings(result);
}

async function render(name) {
  current = name;
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === name)));
  view.replaceChildren(el('p', 'note', 'Loading…'));
  try {
    view.replaceChildren();
    await { memories: showMemories, sessions: showSessions, settings: showSettings }[name]();
  } catch (error) {
    view.replaceChildren(el('p', 'error', error.message));
  }
}

document.querySelectorAll('nav button').forEach(button => button.onclick = () => render(button.dataset.view));
document.getElementById('refresh').onclick = () => render(current);
render(current);
</script>
</body>
</html>

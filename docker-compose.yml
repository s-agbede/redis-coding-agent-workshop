name: coding-agent-guided

services:
  frontend:
    build:
      context: .
      dockerfile: docker-workshop/frontend/Dockerfile
    ports:
      - "${WORKSHOP_BIND_ADDRESS:-0.0.0.0}:${WORKSHOP_PORT:-8080}:80"
    depends_on:
      runtime:
        condition: service_healthy
    restart: unless-stopped

  runtime:
    build:
      context: .
      dockerfile: docker-workshop/docker/guided/Dockerfile
    volumes:
      - ./.workshop-memory:/workspace
      # The previous Alpine environment cannot load Debian native extensions.
      # Keep its volume intact; the workbench has its own reproducible environment.
      - workbench-venv:/opt/student/.venv
      - code-server-data:/opt/code-server
    environment:
      WORKSHOP_PREVIEW_FILE: /tmp/workshop-preview
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-5}
      AGENT_MAX_ITERS: ${AGENT_MAX_ITERS:-25}
      AGENT_REQUEST_TIMEOUT: ${AGENT_REQUEST_TIMEOUT:-90}
      AGENT_AUTO_APPROVE: ${AGENT_AUTO_APPROVE:-}
      AGENT_MEMORY_URL: ${AGENT_MEMORY_URL:-}
      AGENT_MEMORY_STORE_ID: ${AGENT_MEMORY_STORE_ID:-}
      AGENT_MEMORY_API_KEY: ${AGENT_MEMORY_API_KEY:-}
      PLAYBOOK_DATA_PLANE_URL: ${WORKSHOP_PLAYBOOK_DATA_PLANE_URL:-${PLAYBOOK_DATA_PLANE_URL:-}}
      PLAYBOOK_PLAYBOOK_ID: ${PLAYBOOK_PLAYBOOK_ID:-}
      PLAYBOOK_API_KEY: ${PLAYBOOK_API_KEY:-}
      IRIS_OWNER_ID: ${IRIS_OWNER_ID:-}
      PLAYBOOK_SKILL_ID: ${PLAYBOOK_SKILL_ID:-}
      AGENT_MEMORY_CONTROL_PLANE_URL: ${AGENT_MEMORY_CONTROL_PLANE_URL:-}
      AGENT_MEMORY_ADMIN_TOKEN: ${AGENT_MEMORY_ADMIN_TOKEN:-}
      # Instructor only: lets the Agent Memory panel edit the shared store's settings.
      INSPECTOR_ALLOW_EDITS: ${INSPECTOR_ALLOW_EDITS:-}
      # The workshop's own Redis: slash-command completion (FT.SUGADD / FT.SUGGET).
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/api/health >/dev/null && curl -fsS http://localhost:7681/terminal/ >/dev/null && curl -fsS http://localhost:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # The workshop's own Redis 8 (search and autocomplete built in). Also reachable from your
  # terminal at localhost:6390 for runs outside the workbench.
  redis:
    image: redis:8.2.1
    ports:
      - "127.0.0.1:${WORKSHOP_REDIS_PORT:-6390}:6379"
    volumes:
      - workshop-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  # Browse the Redis databases behind the workshop. Slots 1 and 2 are set by
  # scripts/workbench_with_iris_preview.sh (the Iris preview's databases); slot 3 is added by
  # docker-compose.selfhost.yml (self-hosted Agent Memory).
  redisinsight:
    image: redis/redisinsight:3.2.0
    environment:
      RI_PROXY_PATH: /redisinsight
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_REDIS_HOST1: ${INSIGHT_DB1_HOST:-host.docker.internal}
      RI_REDIS_PORT1: ${INSIGHT_DB1_PORT:-16480}
      RI_REDIS_ALIAS1: ${INSIGHT_DB1_ALIAS:-Iris metadata (Memory stores, Playbook entries)}
      RI_REDIS_PASSWORD1: ${INSIGHT_DB1_PASSWORD:-}
      RI_REDIS_HOST2: ${INSIGHT_DB2_HOST:-host.docker.internal}
      RI_REDIS_PORT2: ${INSIGHT_DB2_PORT:-16481}
      RI_REDIS_ALIAS2: ${INSIGHT_DB2_ALIAS:-Iris content (memories, skills)}
      RI_REDIS_PASSWORD2: ${INSIGHT_DB2_PASSWORD:-}
      RI_REDIS_HOST4: redis
      RI_REDIS_PORT4: "6379"
      RI_REDIS_ALIAS4: Workshop Redis (command completion)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - redisinsight-data:/data
    restart: unless-stopped

volumes:
  workbench-venv:
  code-server-data:
  redisinsight-data:
  workshop-redis-data:

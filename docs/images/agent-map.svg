<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">A coding agent: model, harness, tools and environment</title>
  <desc id="desc">A human gives a task to the harness. The harness sends messages and tool schemas to the model, which returns an answer or tool requests. The harness executes tools against the environment and returns their observations to the next request. Independent checks assess the application's behavior.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#547181"/></marker>
    <style>
      .title{font:700 22px system-ui,sans-serif;fill:#142d3b}.label{font:600 19px system-ui,sans-serif;fill:#142d3b}.text{font:15px system-ui,sans-serif;fill:#345262}.edge{font:14px system-ui,sans-serif;fill:#345262}.line{fill:none;stroke:#547181;stroke-width:2;marker-end:url(#arrow)}.box{stroke-width:1.5;rx:15}
    </style>
  </defs>
  <rect width="1000" height="540" rx="18" fill="#f5f8fa"/>
  <text x="34" y="42" class="title">A model chooses. The harness acts and returns observations.</text>
  <rect x="30" y="102" width="154" height="101" class="box" fill="#fff" stroke="#bfced6"/>
  <text x="107" y="139" text-anchor="middle" class="label">Human</text>
  <text x="107" y="168" text-anchor="middle" class="text">Task + review</text>
  <rect x="300" y="82" width="282" height="160" class="box" fill="#e7f2f8" stroke="#5594b4"/>
  <text x="441" y="116" text-anchor="middle" class="label">Harness</text>
  <text x="441" y="146" text-anchor="middle" class="text">Keep and send context</text>
  <text x="441" y="171" text-anchor="middle" class="text">Run permitted tools</text>
  <text x="441" y="196" text-anchor="middle" class="text">Append results; repeat or stop</text>
  <rect x="746" y="102" width="225" height="120" class="box" fill="#f1ecfb" stroke="#a391c1"/>
  <text x="858" y="138" text-anchor="middle" class="label">Model</text>
  <text x="858" y="168" text-anchor="middle" class="text">Generate an answer</text>
  <text x="858" y="193" text-anchor="middle" class="text">or request actions</text>
  <path d="M184 141 H292" class="line"/>
  <text x="239" y="129" text-anchor="middle" class="edge">Task</text>
  <path d="M300 186 H192" class="line"/>
  <text x="239" y="213" text-anchor="middle" class="edge">Answer</text>
  <path d="M582 131 H738" class="line"/>
  <text x="663" y="98" text-anchor="middle" class="edge">Messages +</text>
  <text x="663" y="117" text-anchor="middle" class="edge">tool schemas</text>
  <path d="M746 189 H590" class="line"/>
  <text x="663" y="215" text-anchor="middle" class="edge">Answer / requests</text>
  <rect x="300" y="327" width="282" height="107" class="box" fill="#e6f4eb" stroke="#7aaa8c"/>
  <text x="441" y="363" text-anchor="middle" class="label">Tools</text>
  <text x="441" y="393" text-anchor="middle" class="text">Read · edit · execute</text>
  <rect x="746" y="318" width="225" height="117" class="box" fill="#fff2de" stroke="#c5a471"/>
  <text x="858" y="353" text-anchor="middle" class="label">Environment</text>
  <text x="858" y="384" text-anchor="middle" class="text">Project files</text>
  <text x="858" y="408" text-anchor="middle" class="text">Running application</text>
  <path d="M366 242 V319" class="line"/>
  <text x="354" y="286" text-anchor="end" class="edge">Execute</text>
  <path d="M516 327 V250" class="line"/>
  <text x="530" y="286" class="edge">Results</text>
  <path d="M582 354 H738" class="line"/>
  <text x="662" y="340" text-anchor="middle" class="edge">Read or change</text>
  <path d="M746 407 H590" class="line"/>
  <text x="662" y="431" text-anchor="middle" class="edge">Observations</text>
  <text x="34" y="488" class="label">Independent checks</text>
  <text x="34" y="513" class="text">Measure the requested behavior and existing behavior.</text>
  <path d="M535 488 H858 V443" class="line"/>
</svg>

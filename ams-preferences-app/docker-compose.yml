services:
  redis:
    image: redis:8
    ports:
      - "6379:6379"

  ams:
    image: redislabs/agent-memory-server:latest
    depends_on:
      - redis
    environment:
      # Minimal local/dev config
      REDIS_URL: redis://redis:6379
      DISABLE_AUTH: "true"           # dev only
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_PROVIDER: openai            # via LiteLLM in AMS
      DEFAULT_MEMORY_STRATEGY: preferences
      # Use asyncio task backend in single container mode
    command: ["agent-memory","api","--host","0.0.0.0","--port","8000","--task-backend","asyncio"]
    ports:
      - "8000:8000"

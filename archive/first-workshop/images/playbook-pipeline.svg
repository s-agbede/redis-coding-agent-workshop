<svg xmlns="http://www.w3.org/2000/svg" width="560" height="820" viewBox="0 0 560 820" role="img" aria-labelledby="title desc">
<title id="title">Retrieve a published procedure</title><desc id="desc">The supplied skill is validated and published to Playbook. Discovery and retrieval return a procedure with actual source and version to this agent. A second consumer is an architectural possibility, shown with a dashed connection, not an automatic integration.</desc>

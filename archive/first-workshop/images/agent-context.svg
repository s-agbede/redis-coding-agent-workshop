<svg xmlns="http://www.w3.org/2000/svg" width="560" height="720" viewBox="0 0 560 720" role="img" aria-labelledby="title desc">
<title id="title">The conversation lives in this process</title><desc id="desc">The terminal supplies a task. The harness combines project instructions, a process-local conversation and tool schemas for the model. Tool results return to the conversation. Independent checks remain outside the model loop.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#547181"/></marker></defs>

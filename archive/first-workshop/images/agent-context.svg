er-end="url(#arrow)"/><path d="M430 372 H393" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><rect x="175" y="460" width="210" height="90" rx="12" fill="#e6f4eb" stroke="#7aaa8c" stroke-width="2"/><text x="280.0" y="489" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">Tool registry</text><text x="280.0" y="517" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Read · edit · run</text><path d="M235 410 V452" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><path d="M325 460 V418" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="587" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Tool results return to messages.</text><rect x="20" y="625" width="520" height="65" rx="12" fill="#fff" stroke="#bfced6" stroke-width="2"/><text x="280.0" y="654" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">Independent checks</text><text x="280.0" y="682" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Run separately; inspect actual behavior.</text></g></svg>
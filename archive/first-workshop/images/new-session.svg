<svg xmlns="http://www.w3.org/2000/svg" width="560" height="700" viewBox="0 0 560 700" role="img" aria-labelledby="title desc">
<title id="title">A new session clears the conversation</title><desc id="desc">Project instructions remain on disk and are loaded again. Old user messages, tool results and model replies are absent from the new process-local conversation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#547181"/></marker></defs>
<g font-family="system-ui,sans-serif"><rect width="560" height="700" rx="18" fill="#f5f8fa"/><text x="24" y="36" text-anchor="start" font-size="24" font-weight="700" fill="#142d3b">A new session clears the conversation</text><rect x="20" y="70" width="240" height="110" rx="12" fill="#e7f2f8" stroke="#5594b4" stroke-width="2"/><text x="140.0" y="99" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">Before /new-session</text><text x="140.0" y="127" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">AGENTS.md loaded</text><text x="140.0" y="154" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Conversation present</text><rect x="300" y="70" width="240" height="110" rx="12" fill="#e7f2f8" stroke="#5594b4" stroke-width="2"/><text x="420.0" y="99" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">After /new-session</text><text x="420.0" y="127" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Same file reloaded</text><text x="420.0" y="154" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Conversation empty</text><path d="M260 125 H292" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><rect x="175" y="210" width="210" height="60" rx="12" fill="#fff2de" stroke="#c5a471" stroke-width="2"/><text x="280.0" y="239" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">AGENTS.md</text><path d="M280 270 V310" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="330" width="110" height="90" rx="12" fill="#fff" stroke="#bfced6" stroke-width="2"/><text x="75.0" y="359" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">Terminal</text><text x="75.0" y="387" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Task</text><rect x="175" y="320" width="210" height="120" rx="12" fill="#e7f2f8" stroke="#5594b4" stroke-width="2"/><text x="280.0" y="349" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">Harness</text><text x="280.0" y="377" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Fresh messages</text><text x="280.0" y="404" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Assemble request</text><rect x="430" y="330" width="110" height="90" rx="12" fill="#f1ecfb" stroke="#a391c1" stroke-width="2"/><text x="485.0" y="359" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">Model</text><text x="485.0" y="387" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Respond</text><path d="M130 365 H167" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><path d="M385 355 H422" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><path d="M430 402 H393" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><rect x="175" y="490" width="210" height="90" rx="12" fill="#e6f4eb" stroke="#7aaa8c" stroke-width="2"/><text x="280.0" y="519" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">Tool registry</text><text x="280.0" y="547" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Read · edit · run</text><path d="M235 440 V482" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><path d="M325 490 V448" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="617" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Tool results return to messages.</text><text x="280" y="655" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">File persists. History starts again.</text></g></svg>
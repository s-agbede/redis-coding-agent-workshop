<svg xmlns="http://www.w3.org/2000/svg" width="440" height="520" viewBox="0 0 440 520" role="img" aria-labelledby="title desc"><title id="title">The repeated agent loop</title><desc id="desc">The harness sends current context. A plain model answer ends the turn. If the model requests tools, the harness executes them, appends matching results, and sends the updated context on the next call.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#49697c"/></marker><style>.title{font:700 22px system-ui,sans-serif;fill:#183444}.name{font:650 18px system-ui,sans-serif;fill:#183444}.detail{font:16px system-ui,sans-serif;fill:#385b6d}.arrow{fill:none;stroke:#49697c;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="440" height="520" rx="16" fill="#f3f7fa"/><text x="28" y="34" class="title">The agent loop</text><rect x="25" y="65" width="300" height="78" rx="12" fill="#e4f0f7" stroke="#7ba4ba"/><text x="175.0" y="94" text-anchor="middle" class="name">Harness sends context</text><text x="175.0" y="120" text-anchor="middle" class="detail">Messages + tool schemas</text><path d="M175 143V172" class="arrow"/><rect x="25" y="180" width="300" height="78" rx="12" fill="#eee8f8" stroke="#ad9cc5"/><text x="175.0" y="209" text-anchor="middle" class="name">Model returns a response</text><text x="175.0" y="235" text-anchor="middle" class="detail">No tools? Return to the human.</text><path d="M175 258V287" class="arrow"/><rect x="25" y="295" width="300" height="78" rx="12" fill="#fff0d9" stroke="#c8ab7a"/><text x="175.0" y="324" text-anchor="middle" class="name">Harness executes tools</text><text x="175.0" y="350" text-anchor="middle" class="detail">Read, edit or run a command</text><path d="M175 373V402" class="arrow"/><rect x="25" y="410" width="300" height="78" rx="12" fill="#e4f0f7" stroke="#7ba4ba"/><text x="175.0" y="439" text-anchor="middle" class="name">Harness appends results</text><text x="175.0" y="465" text-anchor="middle" class="detail">One result for every call ID</text><path d="M325 449H404V104H333" class="arrow"/><text x="366" y="285" text-anchor="middle" class="detail">Next</text><text x="366" y="307" text-anchor="middle" class="detail">request</text></svg>

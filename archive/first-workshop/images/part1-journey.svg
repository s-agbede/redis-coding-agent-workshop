<svg xmlns="http://www.w3.org/2000/svg" width="560" height="680" viewBox="0 0 560 680" role="img" aria-labelledby="title desc">
<title id="title">From a call to an agent</title><desc id="desc">Six steps build a model call, conversation, loop, tool use, file reading and repair. Independent checks provide evidence separate from the model’s claim.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#547181"/></marker></defs>
<g font-family="system-ui,sans-serif"><rect width="560" height="680" rx="18" fill="#f5f8fa"/><text x="24" y="36" text-anchor="start" font-size="24" font-weight="700" fill="#142d3b">From a call to an agent</text><rect x="20" y="70" width="240" height="100" rx="12" fill="#f1ecfb" stroke="#a391c1" stroke-width="2"/><text x="140.0" y="99" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">1 · Model call</text><text x="140.0" y="127" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Request → response</text><rect x="300" y="70" width="240" height="100" rx="12" fill="#e7f2f8" stroke="#5594b4" stroke-width="2"/><text x="420.0" y="99" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">2 · Conversation</text><text x="420.0" y="127" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Keep message history</text><rect x="20" y="210" width="240" height="100" rx="12" fill="#e7f2f8" stroke="#5594b4" stroke-width="2"/><text x="140.0" y="239" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">3 · Agent loop</text><text x="140.0" y="267" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Request → act → repeat</text><rect x="300" y="210" width="240" height="100" rx="12" fill="#e6f4eb" stroke="#7aaa8c" stroke-width="2"/><text x="420.0" y="239" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">4 · One tool</text><text x="420.0" y="267" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Execute a tool request</text><rect x="20" y="350" width="240" height="100" rx="12" fill="#e6f4eb" stroke="#7aaa8c" stroke-width="2"/><text x="140.0" y="379" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">5 · Better tools</text><text x="140.0" y="407" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Read and page files</text><rect x="300" y="350" width="240" height="100" rx="12" fill="#fff2de" stroke="#c5a471" stroke-width="2"/><text x="420.0" y="379" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">6 · Repair</text><text x="420.0" y="407" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Change project code</text><path d="M260 120 H292" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><path d="M420 170 V190 H140 V202" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><path d="M260 260 H292" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><path d="M420 310 V330 H140 V342" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><path d="M260 400 H292" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="500" width="520" height="100" rx="12" fill="#fff" stroke="#bfced6" stroke-width="2"/><text x="280.0" y="529" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">Independent verification</text><text x="280.0" y="557" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Run checks against observable behavior.</text><path d="M420 450 V492" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="640" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">A model claim is not test evidence.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="750" viewBox="0 0 560 750" role="img" aria-labelledby="title desc">
<title id="title">Capture now; extract in the background</title><desc id="desc">Original user and assistant events are captured under an owner and session ID. A session store feeds asynchronous extraction into a long-term preference. Extraction is separate from the model request loop.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#547181"/></marker></defs>
<g font-family="system-ui,sans-serif"><rect width="560" height="750" rx="18" fill="#f5f8fa"/><text x="24" y="36" text-anchor="start" font-size="24" font-weight="700" fill="#142d3b">Capture now; extract in the background</text><rect x="20" y="95" width="110" height="90" rx="12" fill="#fff" stroke="#bfced6" stroke-width="2"/><text x="75.0" y="124" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">Terminal</text><text x="75.0" y="152" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Task</text><rect x="175" y="85" width="210" height="120" rx="12" fill="#e7f2f8" stroke="#5594b4" stroke-width="2"/><text x="280.0" y="114" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">Harness</text><text x="280.0" y="142" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Session messages</text><text x="280.0" y="169" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Assemble request</text><rect x="430" y="95" width="110" height="90" rx="12" fill="#f1ecfb" stroke="#a391c1" stroke-width="2"/><text x="485.0" y="124" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">Model</text><text x="485.0" y="152" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Respond</text><path d="M130 130 H167" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><path d="M385 120 H422" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><path d="M430 167 H393" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><rect x="175" y="255" width="210" height="90" rx="12" fill="#e6f4eb" stroke="#7aaa8c" stroke-width="2"/><text x="280.0" y="284" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">Tool registry</text><text x="280.0" y="312" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Read · edit · run</text><path d="M235 205 V247" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><path d="M325 255 V213" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="382" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Tool results return to messages.</text><path d="M175 160 H150 V360 H45 V427" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="435" width="240" height="90" rx="12" fill="#fcebf0" stroke="#bd8095" stroke-width="2"/><text x="140.0" y="464" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">Original events</text><text x="140.0" y="492" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Owner + session ID</text><rect x="300" y="435" width="240" height="90" rx="12" fill="#fcebf0" stroke="#bd8095" stroke-width="2"/><text x="420.0" y="464" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">Session store</text><text x="420.0" y="492" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Recorded exchanges</text><path d="M260 480 H292" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/><path d="M420 525 V560 H280 V582" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="140" y="590" width="280" height="90" rx="12" fill="#fcebf0" stroke="#bd8095" stroke-width="2"/><text x="280.0" y="619" text-anchor="middle" font-size="20" font-weight="700" fill="#142d3b">Extracted preference</text><text x="280.0" y="647" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Long-term memory</text><text x="280" y="548" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Background extraction</text><text x="280" y="717" text-anchor="middle" font-size="18" font-weight="400" fill="#142d3b">Dashed path: asynchronous work.</text></g></svg>
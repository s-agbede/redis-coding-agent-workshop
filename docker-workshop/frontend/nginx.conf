server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 7m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /guide { return 301 /guide/; }
    location /guide/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /guide/index.html;
    }
    # Keep links saved before the workbench migration useful.
    location = /review { return 302 /guide/review; }
    location = /demo { return 302 /guide/demo; }
    location = /build { return 302 /guide/build; }

    location = /vscode { return 301 /vscode/; }
    location /vscode/ {
        set $code http://runtime:8080;
        rewrite ^/vscode/(.*)$ /$1 break;
        proxy_pass $code;
        proxy_set_header Origin $code;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host runtime:8080;
    }

    location /api/ {
        set $editor http://runtime:8081;
        proxy_pass $editor;
        proxy_set_header Host $http_host;
    }

    location = /terminal { return 301 /terminal/; }
    location /terminal/ {
        set $terminal http://runtime:7681;
        proxy_pass $terminal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location = /app { return 301 /app/; }
    location /app/ {
        set $preview http://runtime:8000;
        rewrite ^/app/(.*)$ /$1 break;
        proxy_pass $preview;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /app;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /preview-not-started.html;
    }

    location = /preview-not-started.html { internal; }
    location ~ \.(md|yaml)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}

<svg xmlns="http://www.w3.org/2000/svg" width="440" height="560" viewBox="0 0 440 560" role="img" aria-labelledby="title desc"><title id="title">A tool supplies local file evidence</title><desc id="desc">The harness sends a schema to the model, which requests read_file. The harness runs the Python reader, sends its text with the matching call ID, and asks the model to respond using that observation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#49697c"/></marker><style>.title{font:700 22px system-ui,sans-serif;fill:#183444}.name{font:650 18px system-ui,sans-serif;fill:#183444}.detail{font:16px system-ui,sans-serif;fill:#385b6d}.arrow{fill:none;stroke:#49697c;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="440" height="560" rx="16" fill="#f3f7fa"/><text x="28" y="34" class="title">Request → execute → observe</text><rect x="30" y="60" width="380" height="74" rx="12" fill="#e4f0f7" stroke="#7ba4ba"/><text x="220.0" y="89" text-anchor="middle" class="name">1. Harness sends the task</text><text x="220.0" y="115" text-anchor="middle" class="detail">Messages + reader schema</text><path d="M220 134V152" class="arrow"/><rect x="30" y="160" width="380" height="74" rx="12" fill="#eee8f8" stroke="#ad9cc5"/><text x="220.0" y="189" text-anchor="middle" class="name">2. Model requests read_file</text><text x="220.0" y="215" text-anchor="middle" class="detail">Path + tool-call ID</text><path d="M220 234V252" class="arrow"/><rect x="30" y="260" width="380" height="74" rx="12" fill="#fff0d9" stroke="#c8ab7a"/><text x="220.0" y="289" text-anchor="middle" class="name">3. Harness runs the reader</text><text x="220.0" y="315" text-anchor="middle" class="detail">Python reads the local file</text><path d="M220 334V352" class="arrow"/><rect x="30" y="360" width="380" height="74" rx="12" fill="#e4f0f7" stroke="#7ba4ba"/><text x="220.0" y="389" text-anchor="middle" class="name">4. Harness returns the result</text><text x="220.0" y="415" text-anchor="middle" class="detail">File text + matching tool-call ID</text><path d="M220 434V452" class="arrow"/><rect x="30" y="460" width="380" height="74" rx="12" fill="#eee8f8" stroke="#ad9cc5"/><text x="220.0" y="489" text-anchor="middle" class="name">5. Model uses the observation</text><text x="220.0" y="515" text-anchor="middle" class="detail">Answer based on returned file text</text></svg>

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /docs/ {
            proxy_pass http://docs:80/;
            include /etc/nginx/proxy/proxy-params.conf;
        }

        location /vscode/ {
            proxy_pass http://vscode:8080/;
            include /etc/nginx/proxy/proxy-params.conf;
            include /etc/nginx/proxy/proxy-params-websocket.conf;
        }

        location /terminal/ {
            proxy_pass http://web:7681/;
            include /etc/nginx/proxy/proxy-params.conf;
            include /etc/nginx/proxy/proxy-params-websocket.conf;
        }

        # Hidden until the capstone. When the agent starts uvicorn on port 8000,
        # this panel becomes a same-origin browser preview.
        location /app/ {
            proxy_pass http://web:8000/;
            include /etc/nginx/proxy/proxy-params.conf;
            include /etc/nginx/proxy/proxy-params-websocket.conf;
        }
    }
}

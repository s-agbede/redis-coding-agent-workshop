services:

  # Unified browser workbench
  workbench:
    image: nginx:alpine
    container_name: coding-agent-workbench
    ports:
      - "80:80"
    volumes:
      - ./workbench:/usr/share/nginx/html:ro
      - ./workbench/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./workbench/proxy:/etc/nginx/proxy:ro
    depends_on:
      - docs
      - vscode
      - web

  # Docsify workshop instructions
  docs:
    image: nginx:alpine
    container_name: coding-agent-docs
    volumes:
      - ./docs:/usr/share/nginx/html:ro

  # VS Code in the browser
  vscode:
    image: codercom/code-server:latest
    container_name: coding-agent-vscode
    volumes:
      - ./student:/home/coder/code
      - vscode-data:/home/coder/.local/share/code-server
    command: >-
      --auth none
      --bind-addr 0.0.0.0:8080
      --disable-workspace-trust
      --trusted-origins "*"
      /home/coder/code

  # Python/uv workshop terminal and optional FastAPI preview host
  web:
    build: ./docker/web
    container_name: coding-agent-terminal
    restart: unless-stopped
    volumes:
      - ./student:/workspace
    environment:
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - AGENT_BASE_URL=${AGENT_BASE_URL:-}
      - AGENT_MODEL=${AGENT_MODEL:-gpt-5}
      - AGENT_MAX_ITERS=${AGENT_MAX_ITERS:-25}
      - AGENT_REQUEST_TIMEOUT=${AGENT_REQUEST_TIMEOUT:-90}
      - AGENT_AUTO_APPROVE=${AGENT_AUTO_APPROVE:-}
      - AGENT_VERBOSE=${AGENT_VERBOSE:-}

volumes:
  vscode-data:
